[project]
name = "open-seo"
version = "0.1.0"
description = "Open SEO: SERP rank tracking exposed as an MCP server for Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
]

[project.scripts]
open-seo-mcp = "open_seo.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_seo"]
